<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ org }} — ورود</title><link rel="stylesheet" href="/static/style.css"></head><body class="center-screen"><div class="card lock-card"><h1>ورود به سامانه پایش ایستگاه پمپاژ زیرزمینی</h1><p class="muted">{{ org }} — نسخه {{ version }}</p><div id="groups" class="group-grid">{% for g in groups %}<button class="group-card" data-key="{{ g.key }}">{{ g.label }}<small>{{ 'دسترسی ادمین' if g.role=='admin' else 'اپراتور ثبت' }}</small></button>{% endfor %}</div><div id="login-error" class="error hidden"></div><label>PIN چهاررقمی</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><button id="login-btn" class="btn primary">ورود</button><p class="muted small">PINهای پیش‌فرض: A=1111، B=2222، C=3333، ادمین=9999. پس از اولین ورود ادمین، تغییر PIN پیشنهاد می‌شود.</p></div><script src="/static/login.js"></script></body></html>
