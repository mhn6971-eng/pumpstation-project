<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعمیرات و PM — پمپاژ زیرزمینی</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">پ</div>
    <div><h1>پمپاژ زیرزمینی</h1><span class="sub">سامانه ثبت و پایش تجهیزات</span></div>
  </div>
  <nav>
    <a href="/" class="nav-link">ورود اطلاعات</a>
    <a href="/daily.html" class="nav-link">گزارش روزانه شیفت</a>
    <a href="/plc.html" class="nav-link">ترند PLC</a>
    <a href="/dashboard.html" class="nav-link">داشبورد</a>
    <a href="/maintenance.html" class="nav-link">تعمیرات و PM</a>
    <a href="/shifts.html" class="nav-link">شیفت‌ها</a>
    <a href="/report.html" class="nav-link">گزارش ماهانه</a>
  </nav>
  <div class="header-actions">
    <button id="btn-backup" class="btn ghost">بک‌آپ دیتابیس</button>
  </div>
</header>
<div id="user-bar"></div>

<main class="container">
  <section class="card">
    <h2>ثبت تعمیر یا نگهداری پیشگیرانه (PM)</h2>
    <form id="maint-form" class="maint-form-grid">
      <div class="field">
        <label>تجهیز</label>
        <select id="m-equipment" required></select>
      </div>
      <div class="field">
        <label>نوع</label>
        <select id="m-type">
          <option value="PM">نگهداری پیشگیرانه (PM)</option>
          <option value="repair">تعمیر اضطراری</option>
        </select>
      </div>
      <div class="field">
        <label>تاریخ (میلادی YYYY-MM-DD)</label>
        <input type="date" id="m-date" required>
      </div>
      <div class="field span-3">
        <label>شرح اقدام</label>
        <input type="text" id="m-desc" placeholder="مثلاً گریس‌کاری بلبرینگ، تعویض سیل مکانیکی و...">
      </div>
      <div class="field">
        <label>اپراتور / تعمیرکار</label>
        <input type="text" id="m-operator" placeholder="نام">
      </div>
      <div class="field span-2 actions">
        <button type="submit" class="btn primary">ثبت اقدام</button>
        <span id="m-msg"></span>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>سوابق تعمیرات</h2>
    <div class="table-wrap">
      <table id="maint-table">
        <thead><tr>
          <th>تاریخ</th><th>تجهیز</th><th>نوع</th><th>شرح</th><th>اجراکننده</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script src="app.js"></script>
<script src="maintenance.js"></script>
</body>
</html>
