<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گزارش روزانه شیفت — پمپاژ زیرزمینی</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">پ</div>
    <div><h1>پمپاژ زیرزمینی</h1><span class="sub">سامانه ثبت و پایش تجهیزات</span></div>
  </div>
  <nav>
    <a href="/" class="nav-link">ورود اطلاعات</a>
    <a href="/daily.html" class="nav-link">گزارش روزانه شیفت</a>
    <a href="/plc.html" class="nav-link">ترند PLC</a>
    <a href="/dashboard.html" class="nav-link">داشبورد</a>
    <a href="/maintenance.html" class="nav-link">تعمیرات و PM</a>
    <a href="/shifts.html" class="nav-link">شیفت‌ها</a>
    <a href="/report.html" class="nav-link">گزارش ماهانه</a>
  </nav>
  <div class="header-actions">
    <button id="btn-backup" class="btn ghost">بک‌آپ دیتابیس</button>
  </div>
</header>
<div id="user-bar"></div>

<main class="container">
  <section class="card">
    <h2>فرم گزارش روزانه شیفت</h2>
    <form id="daily-form" class="form-grid">
      <div class="field">
        <label>تاریخ (شمسی)</label>
        <input type="text" id="d-date" required placeholder="1404/08/09" pattern="\d{4}/\d{2}/\d{2}">
      </div>
      <div class="field">
        <label>شیفت</label>
        <select id="d-shift">
          <option value="A">شیفت A</option>
          <option value="B">شیفت B</option>
          <option value="C">شیفت C</option>
        </select>
      </div>
      <div class="field">
        <label>اپراتور</label>
        <input type="text" id="d-operator" placeholder="نام">
      </div>
      <div class="field span-2">
        <label>پمپ‌های روشن</label>
        <div class="checks" id="d-pumps"></div>
      </div>
      <div class="field">
        <label>دبی آب (لیتر بر ثانیه)</label>
        <input type="number" step="0.1" id="d-flow">
      </div>
      <div>
        <label>دبی توتال ۲۴ ساعت روز (متر مکعب یا L/s)</label>
        <input type="number" step="0.1" id="d-total-flow">
      </div>
      <div class="field">
        <label>فشار خط مکش (بار)</label>
        <input type="number" step="0.01" id="d-suction">
      </div>
      <div class="field">
        <label>فشار خط رانش (بار)</label>
        <input type="number" step="0.01" id="d-discharge">
      </div>
      <div class="field">
        <label>فشار مخزن ورودی (بار)</label>
        <input type="number" step="0.01" id="d-tank-inlet">
      </div>
      <div class="field">
        <label>فشار سرچ‌تانک ۱ (بار)</label>
        <input type="number" step="0.01" id="d-surge1">
      </div>
      <div class="field">
        <label>فشار سرچ‌تانک ۲ (بار)</label>
        <input type="number" step="0.01" id="d-surge2">
      </div>
      <div class="field">
        <label>وضعیت پمپ‌های تاسیسات</label>
        <input type="text" id="d-utility" placeholder="مثلاً ۲ عدد در سرویس">
      </div>
      <div class="field">
        <label>وضعیت خنک‌کاری</label>
        <input type="text" id="d-cooling" placeholder="مثلاً نرمال، دمای ورودی ۳۰">
      </div>
      <div class="field span-2">
        <label>توضیحات</label>
        <input type="text" id="d-note">
      </div>
      <div class="span-2 actions">
        <button type="submit" class="btn primary">ثبت گزارش شیفت</button>
        <span id="d-msg"></span>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>گزارش‌های ثبت‌شده</h2>
      <button id="d-print" class="btn ghost">چاپ</button>
    </div>
    <div class="table-wrap">
      <table id="daily-table">
        <thead><tr>
          <th>تاریخ</th><th>شیفت</th><th>اپراتور</th><th>پمپ‌های روشن</th>
          <th>دبی</th><th>دبی توتال</th><th>مکش</th><th>رانش</th><th>مخزن ورودی</th>
          <th>سرچ‌تانک ۱</th><th>سرچ‌تانک ۲</th>
          <th>تاسیسات</th><th>خنک‌کاری</th><th>توضیحات</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script src="app.js"></script>
<script src="daily.js"></script>
</body>
</html>
